services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parkingbusiness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkingbusiness}
      POSTGRES_DB: parkingbusiness
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkingbusiness"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
