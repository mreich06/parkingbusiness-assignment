name: CI

on: push

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://parkingbusiness:parkingbusiness@localhost:5432/parkingbusiness
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkingbusiness
          POSTGRES_PASSWORD: parkingbusiness
          POSTGRES_DB: parkingbusiness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parkingbusiness" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      # Backstop for the lint rules: catches console calls and skipped or focused tests even if someone adds an eslint-disable comment
      - name: No console calls or skipped tests
        run: |
          if grep -rnE --include='*.ts' '\bconsole\.|\b(xit|xdescribe|xtest|fit|fdescribe|ftest)\(|\b(it|describe|test)\.(skip|only|todo)\b' src test; then
            echo "Found console calls or skipped/focused tests"; exit 1
          fi
      - run: npm test
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - name: Audit simulator dependencies
        working-directory: simulator
        run: npm audit --audit-level=high
